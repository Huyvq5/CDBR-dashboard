<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard OU3</title>
<style>
:root{--orange:#F26F21;--navy:#1F3A68;--ink:#1F2933;--muted:#8A94A0;--line:#E6E8EB;--bg:#F6F7F9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:12px;padding:26px 24px;width:100%;max-width:360px}
h1{margin:0 0 4px;font-size:20px;color:var(--navy)}
p{margin:0 0 18px;color:var(--muted);font-size:13px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px}
input[type=password]:focus{outline:2px solid var(--orange);border-color:transparent}
label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:13px;color:#52606D}
button{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--orange);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#D32F2F;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<form class="box" id="f">
  <h1>Dashboard OU3</h1>
  <p>Trang có mật khẩu. Nhập mật khẩu để xem số liệu.</p>
  <input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password" required>
  <label><input type="checkbox" id="remember" checked> Ghi nhớ trên thiết bị này</label>
  <button id="btn">Mở dashboard</button>
  <div class="err" id="err"></div>
</form>

const KEY = 'dash_pw:' + location.pathname;  // mỗi dashboard (tổng hợp / từng tỉnh) nhớ mật khẩu riêng
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'},
                                            base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
const store = { get(){ try { return localStorage.getItem(KEY); } catch(e) { return null; } },
                set(v){ try { localStorage.setItem(KEY, v); } catch(e) {} },
                del(){ try { localStorage.removeItem(KEY); } catch(e) {} } };
const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');
f.onsubmit = async ev => {
  ev.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Đang mở…';
  const pw = document.getElementById('pw').value;
  try {
    if (document.getElementById('remember').checked) store.set(pw); else store.del();
    await unlock(pw);
  } catch (e) {
    store.del(); err.textContent = 'Sai mật khẩu, thử lại.'; btn.disabled = false; btn.textContent = 'Mở dashboard';
  }
};
const saved = store.get();
if (!window.crypto || !crypto.subtle) err.textContent = 'Trình duyệt không hỗ trợ giải mã. Hãy mở bằng Chrome hoặc Safari.';
else if (saved) unlock(saved).catch(() => { store.del(); });
